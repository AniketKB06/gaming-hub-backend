spring:
  application:
    name: gaming-hub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gaming_hub}
    username: ${DB_USERNAME:gaminghub}
    password: ${DB_PASSWORD:gaminghub}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLECLIENTID:}
            client-secret: ${GOOGLECLIENTSECRET:}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: email
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  email:
    from: ${EMAIL_FROM:no-reply@gaminghub.local}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-32-characters}
      access-token-validity-ms: 900000
      refresh-token-validity-ms: 604800000
    otp:
      expiry-minutes: 5
      resend-cooldown-seconds: 60
      max-requests-per-day: 10
      max-attempts: 5
    booking:
      hold-expiry-minutes: 15
  payment:
    razorpay:
      key-id: ${RAZORPAYKEYID:}
      key-secret: ${RAZORPAYKEYSECRET:}
      webhook-secret: ${RAZORPAYWEBHOOKSECRET:}
      currency: INR
      enabled: ${RAZORPAY_ENABLED:false}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    com.gaminghub: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
